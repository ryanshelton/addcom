<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Addcom - We're building something new.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500&family=Roboto:wght@400&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #010646; overflow: hidden; }
canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; }

/* mobile-first: matches Figma "iPhone 13 & 14" frame (node 37:69) */
.hero {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: 64px 24px;
}

.hero-line {
  align-self: stretch;
  flex: none;
  width: 2px;
  background: #ffffff;
}

.hero-content {
  display: flex;
  flex-direction: column;
  gap: 40px;
  align-items: flex-start;
}

.hero-logo {
  display: block;
  width: 133px;
  height: auto;
}

.hero-content h1 {
  font-family: 'Figtree', sans-serif;
  font-weight: 500;
  color: #4ffc80;
  font-size: 42px;
  line-height: 42px;
  margin: 0;
}

.hero-content .lede {
  font-family: 'Roboto', sans-serif;
  font-weight: 400;
  color: #ffffff;
  font-size: 21px;
  line-height: 28px;
  max-width: 620px;
  margin: 0;
}

.contact {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.contact-row {
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: 'Roboto', sans-serif;
  font-weight: 400;
  font-size: 17px;
  line-height: 24px;
  color: #ffffff;
}

.contact-row img { width: 24px; height: 24px; flex: none; }

.contact-row a {
  color: #4ffc80;
  text-decoration: none;
}

.contact-row a:hover { text-decoration: underline; }

/* desktop: matches Figma "Desktop Max (MBP 14')" frame (node 1:11) */
@media (min-width: 768px) {
  .hero { gap: 56px; padding: 72px 56px; }
  .hero-logo { width: 195px; }
  .hero-content h1 { font-size: 100px; line-height: 100px; }
  .hero-content .lede { font-size: 24px; line-height: 32px; }
  .contact { gap: 16px; }
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hero">
  <div class="hero-line"></div>
  <div class="hero-content">
    <img class="hero-logo" src="assets/logo.svg" alt="Addcom">
    <h1>We're building<br>something new.</h1>
    <p class="lede">The next generation of Addcom's unified communications and managed IT platform is on its way.</p>
    <div class="contact">
      <div class="contact-row">
        <img src="assets/icon-phone.svg" alt="">
        <span>+61 1300 789 600 or +61 2 8877 5600</span>
      </div>
      <div class="contact-row">
        <img src="assets/icon-paperplane.svg" alt="">
        <a href="mailto:contact@addcom.com">contact@addcom.com</a>
      </div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl');

const vertSrc = `
attribute vec2 aPos;
void main() {
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

const fragSrc = `
precision highp float;

uniform vec2 uResolution;
uniform float uTime;
uniform float uSpeed;
uniform float uScale;
uniform float uSoftness;
uniform float uBottomFade;

// palette drawn from the brand set
const vec3 navy   = vec3(0.00392, 0.02353, 0.27451); // #010646
const vec3 orange = vec3(0.94510, 0.34118, 0.22353); // #F15739
const vec3 cyan    = vec3(0.00000, 0.74902, 0.97255); // #00BFF8
const vec3 green   = vec3(0.30980, 0.98824, 0.50196); // #4FFC80
const vec3 teal     = vec3(0.16078, 0.67451, 0.69804); // #29ACB2
const vec3 blue     = vec3(0.02745, 0.40000, 0.67843); // #0766AD
const vec3 deepBlue = vec3(0.00000, 0.01176, 0.15294); // #000327 - dark floor instead of flat black
const vec3 black    = vec3(0.0, 0.0, 0.0);

vec2 hash(vec2 p) {
  p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
  return -1.0 + 2.0 * fract(sin(p) * 43758.5453123);
}

float noise(vec2 p) {
  const float K1 = 0.366025404;
  const float K2 = 0.211324865;
  vec2 i = floor(p + (p.x + p.y) * K1);
  vec2 a = p - i + (i.x + i.y) * K2;
  vec2 o = a.x > a.y ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec2 b = a - o + K2;
  vec2 c = a - 1.0 + 2.0 * K2;
  vec3 h = max(0.5 - vec3(dot(a, a), dot(b, b), dot(c, c)), 0.0);
  vec3 n = h * h * h * h * vec3(dot(a, hash(i)), dot(b, hash(i + o)), dot(c, hash(i + 1.0)));
  return dot(n, vec3(70.0));
}

float fbm(vec2 p) {
  float v = 0.0;
  float amp = 0.5;
  mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
  for (int i = 0; i < 5; i++) {
    v += amp * noise(p);
    p = rot * p * 2.0;
    amp *= 0.5;
  }
  return v;
}

// smooth multi-stop mix across the palette using t in [0,1]
vec3 palette(float t) {
  t = fract(t);
  float scaled = t * 6.0;
  float seg = floor(scaled);
  float f = fract(scaled);
  f = f * f * (3.0 - 2.0 * f);

  vec3 a, b;
  if (seg < 1.0) { a = navy; b = blue; }
  else if (seg < 2.0) { a = blue; b = teal; }
  else if (seg < 3.0) { a = teal; b = cyan; }
  else if (seg < 4.0) { a = cyan; b = green; }
  else if (seg < 5.0) { a = green; b = orange; }
  else { a = orange; b = navy; }

  return mix(a, b, f);
}

// polynomial smooth minimum - lets blob fields merge into one another
float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}

void main() {
  vec2 uv = gl_FragCoord.xy / uResolution.xy;
  vec2 p = (gl_FragCoord.xy - 0.5 * uResolution.xy) / uResolution.y;
  float t = uTime * 0.045 * uSpeed;

  // gentle organic wobble applied to the whole field before distance tests
  vec2 warp = vec2(fbm(p * 0.8 + t * 0.6), fbm(p * 0.8 - t * 0.5 + 4.0)) * 0.08;
  vec2 pw = p + warp;

  // five slow-drifting blobs, each anchored near a "home" spot then wandering gently
  // (kept to blue / teal / cyan / green / black - orange muddied things when blended in)
  // homes form an overlapping chain across the upper band: cyan (left) -> teal -> green (top-right)
  // black sits in the bottom-left corner
  vec2 c1 = vec2(0.0, -0.05) + vec2(0.10 * sin(t * 0.62 + 0.0), 0.08 * cos(t * 0.48 + 1.1));
  vec2 c2 = vec2(-0.05, 0.32) + vec2(0.12 * sin(t * 0.51 + 2.0), 0.09 * cos(t * 0.63 + 3.3));
  vec2 c3 = vec2(-0.62, 0.15) + vec2(0.10 * cos(t * 0.71 + 1.4), 0.08 * sin(t * 0.55 + 0.6));
  vec2 c4 = vec2(0.48, 0.30) + vec2(0.12 * cos(t * 0.44 + 0.9), 0.10 * sin(t * 0.66 + 2.2));
  vec2 c5 = vec2(-0.68, 0.06) + vec2(0.08 * cos(t * 0.5 + 0.4), 0.06 * sin(t * 0.6 + 1.7));

  float r1 = (0.30 + 0.04 * sin(t * 0.9)) * uScale;
  float r2 = (0.34 + 0.04 * cos(t * 0.7 + 1.0)) * uScale;
  float r3 = (0.42 + 0.03 * sin(t * 1.1 + 2.0)) * uScale;
  float r4 = (0.46 + 0.04 * cos(t * 0.8 + 0.3)) * uScale;
  float r5 = (0.40 + 0.04 * sin(t * 0.85 + 1.2)) * uScale;

  float d1 = length(pw - c1) - r1;
  float d2 = length(pw - c2) - r2;
  float d3 = length(pw - c3) - r3;
  float d4 = length(pw - c4) - r4;
  float d5 = length(pw - c5) - r5;

  float k = uSoftness;
  float d = d1;
  d = smin(d, d2, k);
  d = smin(d, d3, k);
  d = smin(d, d4, k);
  d = smin(d, d5, k);

  float shape = 1.0 - smoothstep(-0.05, 0.35, d);

  // weighted color blend - each blob pulls color toward it near its own field
  // unclamped (vs. max(d,0)) so weight keeps rising toward each blob's own
  // center instead of plateauing at 1 throughout its whole interior - lets a
  // smaller blob (like the black one) dominate its own core even when it
  // overlaps a larger blob's radius
  float w1 = exp(-d1 * 6.0);
  float w2 = exp(-d2 * 6.0);
  float w3 = exp(-d3 * 6.0);
  float w4 = exp(-d4 * 6.0);
  float w5 = exp(-d5 * 6.0);
  float wsum = w1 + w2 + w3 + w4 + w5 + 0.0001;

  vec3 blend = (w1 * blue + w2 * teal + w3 * cyan + w4 * green + w5 * black) / wsum;

  vec3 col = mix(navy, blend, shape);

  // bright core where several blobs overlap - keep it saturated, not washed out
  float core = 1.0 - smoothstep(-0.1, 0.15, d);
  col = mix(col, mix(blend, vec3(1.0), 0.22), core * core * 0.45);

  // fade to deep blue - rather than flat black - at the bottom
  float bottomFade = smoothstep(0.0, uBottomFade, uv.y);
  col = mix(deepBlue, col, bottomFade);

  gl_FragColor = vec4(col, 1.0);
}`;

function compile(type, src) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, src);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(shader));
  }
  return shader;
}

const program = gl.createProgram();
gl.attachShader(program, compile(gl.VERTEX_SHADER, vertSrc));
gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragSrc));
gl.linkProgram(program);
gl.useProgram(program);

const quad = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(program, 'aPos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const uResolution = gl.getUniformLocation(program, 'uResolution');
const uTime = gl.getUniformLocation(program, 'uTime');
const uSpeed = gl.getUniformLocation(program, 'uSpeed');
const uScale = gl.getUniformLocation(program, 'uScale');
const uSoftness = gl.getUniformLocation(program, 'uSoftness');
const uBottomFade = gl.getUniformLocation(program, 'uBottomFade');

// slider-controlled params
const params = {
  speed: 10,
  scale: 0.76,
  softness: 0.2,
  bottomFade: 1.2,
};

function resize() {
  canvas.width = window.innerWidth * Math.min(devicePixelRatio, 2);
  canvas.height = window.innerHeight * Math.min(devicePixelRatio, 2);
  gl.viewport(0, 0, canvas.width, canvas.height);
}

const start = performance.now();
function draw(now) {
  gl.uniform2f(uResolution, canvas.width, canvas.height);
  gl.uniform1f(uTime, (now - start) / 1000);
  gl.uniform1f(uSpeed, params.speed);
  gl.uniform1f(uScale, params.scale);
  gl.uniform1f(uSoftness, params.softness);
  gl.uniform1f(uBottomFade, params.bottomFade);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(draw);
}

window.addEventListener('resize', resize);

resize();
requestAnimationFrame(draw);

// --- slider panel ---------------------------------------------------------
const sliderDefs = [
  { key: 'speed', label: 'Speed', min: 1, max: 10, step: 1 },
  { key: 'scale', label: 'Blob Size', min: 0.5, max: 1.8, step: 0.02 },
  { key: 'softness', label: 'Merge Softness', min: 0.05, max: 0.5, step: 0.01 },
  { key: 'bottomFade', label: 'Bottom Fade', min: 0.3, max: 1.2, step: 0.01 },
];

const panel = document.createElement('div');
panel.style.cssText = `
  position: fixed; bottom: 16px; left: 16px; z-index: 10;
  background: rgba(1, 6, 70, 0.55); backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.12); border-radius: 12px;
  padding: 14px 16px; font: 12px/1.4 system-ui, sans-serif; color: #dfe7ff;
  width: 200px; user-select: none;
`;

sliderDefs.forEach(def => {
  const row = document.createElement('div');
  row.style.cssText = 'margin-bottom: 10px;';

  const labelRow = document.createElement('div');
  labelRow.style.cssText = 'display:flex; justify-content:space-between; margin-bottom:4px; opacity:0.85;';
  const label = document.createElement('span');
  label.textContent = def.label;
  const value = document.createElement('span');
  value.textContent = params[def.key];
  labelRow.appendChild(label);
  labelRow.appendChild(value);

  const input = document.createElement('input');
  input.type = 'range';
  input.autocomplete = 'off';
  input.min = def.min;
  input.max = def.max;
  input.step = def.step;
  input.value = params[def.key];
  input.style.cssText = 'width:100%; accent-color:#4FFC80;';
  input.addEventListener('input', () => {
    params[def.key] = parseFloat(input.value);
    value.textContent = input.value;
  });

  row.appendChild(labelRow);
  row.appendChild(input);
  panel.appendChild(row);
});

document.body.appendChild(panel);
</script>
</body>
</html>
